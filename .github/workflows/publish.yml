name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only run npm pack + dry-run publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dev dependencies
        run: npm install --ignore-scripts

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack --dry-run

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run

      - name: Check whether this version is already published
        id: registry
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`)
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry check failed: HTTP ${response.status}`)
          }
          const exists = response.status === 200
          if (exists && (await response.json()).version !== version) {
            throw new Error('Unexpected registry version')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!exists}\n`)
          console.log(exists ? `${name}@${version} is already published; skipping publish.` : `${name}@${version} is available for publishing.`)
          NODE

      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
